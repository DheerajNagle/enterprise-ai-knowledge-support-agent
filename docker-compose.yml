services:
  # ============================================================================
  # Qdrant Vector Database Service
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: enterprise_ai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - enterprise_agent_network

  # ============================================================================
  # Enterprise AI Agent API Service (FastAPI)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_ai_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - enterprise_agent_network

volumes:
  qdrant_storage:
    driver: local

networks:
  enterprise_agent_network:
    driver: bridge
