services:
  # ============================================================================
  # 1. Qdrant Vector Database Service
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: enterprise_ai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - enterprise_agent_network

  # ============================================================================
  # 2. FastMCP Model Context Protocol Service (SSE / HTTP Transport)
  # ============================================================================
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    container_name: enterprise_ai_mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=data/enterprise.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - enterprise_agent_network

  # ============================================================================
  # 3. Enterprise AI Agent API Gateway (FastAPI & Google ADK Orchestrator)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: enterprise_ai_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_KEY=${API_KEY:-dev-insecure-api-key-replace-in-prod}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - QDRANT_URL=http://qdrant:6333
      - MCP_SERVER_URL=http://mcp:8001/sse
      - SQLITE_DB_PATH=data/enterprise.db
    volumes:
      - sqlite_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - enterprise_agent_network

  # ============================================================================
  # 4. Executive Web Console (Streamlit Frontend)
  # ============================================================================
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    container_name: enterprise_ai_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - API_KEY=${API_KEY:-dev-insecure-api-key-replace-in-prod}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - enterprise_agent_network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  qdrant_storage:
    driver: local
  sqlite_data:
    driver: local

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  enterprise_agent_network:
    driver: bridge
